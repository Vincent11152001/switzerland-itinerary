    function setLang(lang){
      const d = DATA[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
      document.getElementById('btnZh').classList.toggle('active', lang==='zh');

      document.getElementById('heroTitle').textContent=d.title;

      document.getElementById('overview').innerHTML=d.overview.map(s=>`<div class="stat"><div class="num">${s[0]}</div><div class="label">${s[1]}</div></div>`).join('');
      Object.entries({flight:'flight',hotel:'hotel',map:'map',daily:'daily',note:'notes',link:'links',transport:'transport',weather:'weather',packing:'packing'}).forEach(([id,key])=>{document.getElementById(`${id}Title`).textContent=d.sections[key][0];document.getElementById(`${id}Sub`).textContent=d.sections[key][1];});

      document.getElementById('flightTable').innerHTML=htmlTable(d.flightHeads,d.flights);
      document.getElementById('hotelGrid').innerHTML=d.hotels.map(h=>`<article class="hotel"><div class="city">${h[0]}</div><h3>${h[1]}</h3><p>${h[2]}</p><p>${h[3]}</p><span class="badge">${h[4]}</span></article>`).join('');
      document.getElementById('mapSvg').innerHTML=svgMap();
      document.getElementById('mapGuideTitle').textContent=d.mapGuide[0];document.getElementById('mapGuideText').textContent=d.mapGuide[1];
      document.getElementById('mapSummary').innerHTML=d.mapSummary.map(x=>`<div class="summary-row"><strong><span class="map-index">${x[0]}</span>${x[1]}</strong><span>${x[2]}</span></div>`).join('');
      document.getElementById('mapLegend').innerHTML=d.legend.map(x=>`<div class="legend-item"><span class="legend-dot ${x[0]}"></span><strong>${x[1]}</strong>：${x[2]}</div>`).join('');
      document.getElementById('routeCards').innerHTML=d.routes.map((r,i)=>`<article class="route-card"><h3><span class="map-index">${r[0]}</span>${r[1]}</h3><div class="route-meta">${r[2].map(m=>`<span>${m}</span>`).join('')}</div><p>${r[3]}</p><a href="${routeUrls[i]}" target="_blank" rel="noopener">${d.routeOpen}</a></article>`).join('');
      document.getElementById('timeline').innerHTML=d.days.map(day=>`<article class="day-card"><div class="date-box"><div class="day">${day[0]}</div><div class="date">${day[1]}</div><div class="weekday">${day[2]}</div></div><div class="content"><h3>${day[3]}</h3><div class="route">${day[4]}</div>${list(day[5])}<span class="intensity ${day[8]}">${day[6]}</span></div><aside class="side"><strong>${d.stay}</strong>${day[7]}</aside></article>`).join('');

    function htmlTable(heads, rows){return `<thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<strong>${c}</strong>`:c}</td>`).join('')}</tr>`).join('')}</tbody>`}
    function list(items){return `<ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`}

ize="17">Lake Lucerne</text><path class="route-blue-soft" d="M970 178 C825 216 694 274 555 340 C445 394 348 333 276 302"/><path class="route-blue" d="M970 178 C825 216 694 274 555 340 C445 394 348 333 276 302" marker-end="url(#arrBlue)"/><path class="route-blue-soft" d="M276 302 C370 316 465 328 555 340"/><path class="route-blue" d="M276 302 C370 316 465 328 555 340" marker-end="url(#arrBlue)"/><path class="route-blue-soft" d="M555 340 C620 415 690 505 770 575"/><path class="route-blue" d="M555 340 C620 415 690 505 770 575" marker-end="url(#arrBlue)"/><path class="route-blue-soft" d="M770 575 C862 515 935 360 970 178"/><path class="route-blue" d="M770 575 C862 515 935 360 970 178" marker-end="url(#arrBlue)"/><path class="route-green" d="M276 302 C230 340 212 390 244 438" marker-end="url(#arrGreen)"/><path class="route-green" d="M555 340 C594 270 656 230 727 215" marker-end="url(#arrGreen)"/><path class="route-green" d="M555 340 C643 345 746 360 850 390" marker-end="url(#arrGreen)"/><path class="route-green" d="M555 340 C510 420 498 510 535 612" marker-end="url(#arrGreen)"/><path class="route-green" d="M770 575 C748 490 747 420 770 365" marker-end="url(#arrGreen)"/><path class="route-gold" d="M555 340 C610 300 665 286 715 305" marker-end="url(#arrGold)"/><g filter="url(#pinShadow)"><circle cx="970" cy="178" r="30" fill="#2563eb"/><text x="970" y="188" text-anchor="middle" fill="white" font-size="24" font-weight="900">1</text><circle cx="276" cy="302" r="30" fill="#2563eb"/><text x="276" y="312" text-anchor="middle" fill="white" font-size="24" font-weight="900">2</text><circle cx="555" cy="340" r="34" fill="#2563eb"/><text x="555" y="352" text-anchor="middle" fill="white" font-size="26" font-weight="900">3</text><circle cx="770" cy="575" r="30" fill="#2563eb"/><text x="770" y="585" text-anchor="middle" fill="white" font-size="24" font-weight="900">4</text><circle cx="244" cy="438" r="21" fill="#16a34a"/><text x="244" y="446" text-anchor="middle" fill="white" font-size="17" font-weight="900">S</text><circle cx="727" cy="215" r="21" fill="#16a34a"/><text x="727" y="223" text-anchor="middle" fill="white" font-size="17" font-weight="900">R</text><circle cx="850" cy="390" r="21" fill="#16a34a"/><text x="850" y="398" text-anchor="middle" fill="white" font-size="17" font-weight="900">B</text><circle cx="535" cy="612" r="21" fill="#16a34a"/><text x="535" y="620" text-anchor="middle" fill="white" font-size="17" font-weight="900">O</text><circle cx="770" cy="365" r="21" fill="#16a34a"/><text x="770" y="373" text-anchor="middle" fill="white" font-size="17" font-weight="900">G</text><circle cx="715" cy="305" r="21" fill="#f59e0b"/><text x="715" y="313" text-anchor="middle" fill="white" font-size="17" font-weight="900">J</text></g><g><text x="1000" y="166" class="map-label" font-size="24">Zurich</text><text x="1000" y="193" class="map-sub" font-size="15">ZRH / final night</text><text x="146" y="294" class="map-label" font-size="24">Lucerne</text><text x="146" y="321" class="map-sub" font-size="15">2 nights</text><text x="590" y="334" class="map-label" font-size="26">Interlaken</text><text x="590" y="362" class="map-sub" font-size="15">6-night basecamp</text><text x="795" y="575" class="map-label" font-size="24">Täsch / Zermatt</text><text x="795" y="602" class="map-sub" font-size="15">Matterhorn base</text><text x="175" y="450" class="map-label" font-size="18">Stoos</text><text x="745" y="215" class="map-label" font-size="18">Rothorn</text><text x="870" y="392" class="map-label" font-size="18">Bern</text><text x="395" y="620" class="map-label" font-size="18">Oeschinensee</text><text x="790" y="365" class="map-label" font-size="18">Gornergrat / Glacier</text><text x="735" y="300" class="map-label" font-size="18">Jungfrau / First</text></g></svg>`}

    function setLang(lang){
      const d = DATA[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
      document.getElementById('btnZh').classList.toggle('active', lang==='zh');
      document.getElementById('btnEn').classList.toggle('active', lang==='en');
      document.getElementById('heroTitle').textContent=d.title;
      document.getElementById('heroSubtitle').textContent=d.subtitle;
      document.getElementById('heroChips').innerHTML=d.chips.map(c=>`<span class="chip">${c}</span>`).join('');
      document.getElementById('overview').innerHTML=d.overview.map(s=>`<div class="stat"><div class="num">${s[0]}</div><div class="label">${s[1]}</div></div>`).join('');
      Object.entries({flight:'flight',hotel:'hotel',map:'map',daily:'daily',note:'notes',link:'links',transport:'transport',budget:'budget',weather:'weather',packing:'packing'}).forEach(([id,key])=>{document.getElementById(`${id}Title`).textContent=d.sections[key][0];document.getElementById(`${id}Sub`).textContent=d.sections[key][1];});
      document.getElementById('fullMapBtn').textContent=d.btns[0];document.getElementById('sbbBtn').textContent=d.btns[1];
      document.getElementById('flightTable').innerHTML=htmlTable(d.flightHeads,d.flights);
      document.getElementById('hotelGrid').innerHTML=d.hotels.map(h=>`<article class="hotel"><div class="city">${h[0]}</div><h3>${h[1]}</h3><p>${h[2]}</p><p>${h[3]}</p><span class="badge">${h[4]}</span></article>`).join('');
      document.getElementById('mapSvg').innerHTML=svgMap();
      document.getElementById('mapGuideTitle').textContent=d.mapGuide[0];document.getElementById('mapGuideText').textContent=d.mapGuide[1];
      document.getElementById('mapSummary').innerHTML=d.mapSummary.map(x=>`<div class="summary-row"><strong><span class="map-index">${x[0]}</span>${x[1]}</strong><span>${x[2]}</span></div>`).join('');
      document.getElementById('mapLegend').innerHTML=d.legend.map(x=>`<div class="legend-item"><span class="legend-dot ${x[0]}"></span><strong>${x[1]}</strong>：${x[2]}</div>`).join('');
      document.getElementById('routeCards').innerHTML=d.routes.map((r,i)=>`<article class="route-card"><h3><span class="map-index">${r[0]}</span>${r[1]}</h3><div class="route-meta">${r[2].map(m=>`<span>${m}</span>`).join('')}</div><p>${r[3]}</p><a href="${routeUrls[i]}" target="_blank" rel="noopener">${d.routeOpen}</a></article>`).join('');
      document.getElementById('timeline').innerHTML=d.days.map(day=>`<article class="day-card"><div class="date-box"><div class="day">${day[0]}</div><div class="date">${day[1]}</div><div class="weekday">${day[2]}</div></div><div class="content"><h3>${day[3]}</h3><div class="route">${day[4]}</div>${list(day[5])}<span class="intensity ${day[8]}">${day[6]}</span></div><aside class="side"><strong>${d.stay}</strong>${day[7]}</aside></article>`).join('');
      document.getElementById('notes').innerHTML=d.notes.map(n=>`<article class="note"><h3>${n[0]}</h3><p>${n[1]}</p></article>`).join('');
      document.getElementById('mapLinks').innerHTML=mapLinks.map(l=>`<a class="map-link" href="${l[2]}" target="_blank"><strong>${l[0]}</strong><span>${l[1]}</span></a>`).join('');
      document.getElementById('transportTable').innerHTML=htmlTable(d.transportHeads,d.transport);
      document.getElementById('budgetTable').innerHTML=htmlTable(d.budgetHeads,d.budget);
      document.getElementById('budgetCards').innerHTML=d.budgetCards.map(b=>`<div class="budget-card"><div class="amount">${b[0]}</div><div class="caption">${b[1]}</div></div>`).join('');
      document.getElementById('budgetNote').textContent=d.budgetNote;
      document.getElementById('weatherTable').innerHTML=htmlTable(d.weatherHeads,d.weather);
      document.getElementById('packingGrid').innerHTML=d.packing.map(p=>`<article class="check-card"><h3>${p[0]}</h3>${list(p[1])}</article>`).join('');
      document.getElementById('footerText').textContent=d.footer;
    }

    setLang('zh');
  </script>
